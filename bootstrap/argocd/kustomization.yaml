apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set namespace for all namespaced ArgoCD resources
# The install.yaml doesn't include namespace, so kustomize adds it
namespace: argocd

resources:
  - namespace.yaml
  - install.yaml
  - service-account.yaml
  - secret-store.yaml
  - cluster-metadata-annotations-template.yaml
  - external-secret-argocd-cluster.yaml
  - external-secret-git-credentials.yaml
  - root-applicationset.yaml

# Pin Dex to v2.45.1 — ArgoCD v3.4.3 ships v2.45.0 which broke the authproxy
# connector (dexidp/dex#4589, fixed in v2.45.1). Remove once ArgoCD ships ≥v2.45.1.
images:
  - name: ghcr.io/dexidp/dex
    newTag: v2.45.1

# Add mutation: ignore annotation to configmaps that will be managed by argocd-config
# ConfigSync creates them initially, but allows ArgoCD to freely update them
# This prevents resource fights between ConfigSync and ArgoCD
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
        annotations:
          client.lifecycle.config.k8s.io/mutation: ignore
    target:
      kind: ConfigMap
      name: argocd-cm
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
        annotations:
          client.lifecycle.config.k8s.io/mutation: ignore
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-rbac-cm
        annotations:
          client.lifecycle.config.k8s.io/mutation: ignore
    target:
      kind: ConfigMap
      name: argocd-rbac-cm
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-notifications-cm
        annotations:
          client.lifecycle.config.k8s.io/mutation: ignore
    target:
      kind: ConfigMap
      name: argocd-notifications-cm
  # Allow ESO to write github-app-private-key into the notifications secret
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-notifications-secret
        annotations:
          client.lifecycle.config.k8s.io/mutation: ignore
    target:
      kind: Secret
      name: argocd-notifications-secret
  # Allow argocd-config to patch the Service (adds appProtocol: HTTPS)
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-server
        annotations:
          client.lifecycle.config.k8s.io/mutation: ignore
    target:
      kind: Service
      name: argocd-server
  # Seed dex.config at bootstrap so argocd-server initializes its OIDC
  # http.Client with the correct TLS settings before argocd-config delivers
  # the full argocd-cm.  See https://github.com/argoproj/argo-cd/issues/26345
  - path: argocd-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  # dev-patmarti only: bump this annotation to force a rollout of the argocd
  # workloads. Config Sync continuously reconciles this branch, so a bump here
  # is enough to restart the pods without kubectl — needed because pods only
  # read argocd-cmd-params-cm env vars (e.g. log level) at process start.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        template:
          metadata:
            annotations:
              dev-patmarti/restart-trigger: "1"
    target:
      kind: Deployment
      name: argocd-server
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          metadata:
            annotations:
              dev-patmarti/restart-trigger: "1"
    target:
      kind: Deployment
      name: argocd-repo-server
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
      spec:
        template:
          metadata:
            annotations:
              dev-patmarti/restart-trigger: "1"
    target:
      kind: Deployment
      name: argocd-applicationset-controller
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          metadata:
            annotations:
              dev-patmarti/restart-trigger: "1"
    target:
      kind: StatefulSet
      name: argocd-application-controller
