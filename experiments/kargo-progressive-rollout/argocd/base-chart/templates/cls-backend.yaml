apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cls-backend-{{ .Values.environment }}-{{ .Values.sector }}-{{ .Values.region }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.git_repo }}
    targetRevision: {{ .Values.git_revision }}
    path: experiments/kargo-progressive-rollout/helm/charts/cls-backend
    helm:
      parameters:
        - name: image.tag
          value: {{ index .Values.apps "cls-backend" "image" "tag" }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cls-backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
