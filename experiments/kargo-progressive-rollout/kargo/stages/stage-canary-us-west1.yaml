apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage-canary-us-west1
  namespace: progressive-rollout-experiment
  labels:
    environment: stage
    sector: canary
    region: us-west1
spec:
  # Component-level: each component must be verified in int-main before
  # becoming eligible here. Manual approval required (env gate via ProjectConfig).
  requestedFreight:
  - origin:
      kind: Warehouse
      name: myapp
    sources:
      stages:
      - int-main-us-central1
  - origin:
      kind: Warehouse
      name: cls-backend
    sources:
      stages:
      - int-main-us-central1
  - origin:
      kind: Warehouse
      name: monitoring
    sources:
      stages:
      - int-main-us-central1
  promotionTemplate:
    spec:
      vars:
      - name: targetPath
        value: stage/canary/us-west1
      steps:
      - task:
          name: argocd-gitops-promote
          kind: ClusterPromotionTask
  verification:
    analysisTemplates:
    - name: platform-health-check
    - name: http-api-check
    args:
    - name: stage-name
      value: stage-canary-us-west1
    - name: git-revision
      value: ${{ commitFrom("https://github.com/patjlm/gcp-hcp.git").ID }}
