apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: http-api-check
  namespace: progressive-rollout-experiment
spec:
  metrics:
  - name: api-health
    count: 3
    interval: 10s
    failureLimit: 1
    successCondition: result.status == "healthy"
    provider:
      web:
        url: http://health-server.progressive-rollout-experiment.svc:8080/healthz
        jsonPath: "{$.status}"
