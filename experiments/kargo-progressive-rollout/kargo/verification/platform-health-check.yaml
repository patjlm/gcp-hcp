apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: platform-health-check
  namespace: progressive-rollout-experiment
spec:
  metrics:
  - name: e2e-health
    count: 1
    failureLimit: 0
    provider:
      job:
        spec:
          template:
            spec:
              containers:
              - name: health-check
                image: curlimages/curl:latest
                command:
                - sh
                - -c
                - "echo 'Running platform health check...' && sleep 5 && echo 'Health check passed'"
              restartPolicy: Never
          backoffLimit: 0
