apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: platform-health-check
  namespace: progressive-rollout-experiment
spec:
  args:
  - name: stage-name
  - name: git-revision
  metrics:
  - name: e2e-health
    count: 1
    failureLimit: 0
    provider:
      job:
        spec:
          template:
            spec:
              containers:
              - name: health-check
                image: quay.io/patmarti/kargo-health-check:latest
                env:
                - name: STAGE_NAME
                  value: "{{ args.stage-name }}"
                - name: GIT_REVISION
                  value: "{{ args.git-revision }}"
              restartPolicy: Never
          backoffLimit: 0
